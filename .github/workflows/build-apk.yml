name: Build Free Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare www folder
        run: |
          mkdir -p www/fonts
          cp index.html style.css manifest.json service-worker.js www/
          cp *.woff2 www/fonts/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Capacitor CLI
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Initialize Capacitor
        run: |
          rm -rf android
          npx cap init "SpinMaster TT" "com.spinmaster.tt" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpinMaster-TT-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
